services:
  postgres:
    image: postgres:16-alpine
    container_name: finsight-postgres

    environment:
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: finsight_password
      POSTGRES_DB: finsight

    ports:
      - "5434:5432"

    volumes:
      - finsight_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U finsight -d finsight" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finsight_postgres_data:
